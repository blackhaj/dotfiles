# App-managed state
[notice]
fast_default_opt_out = true

[notice.model_migrations]
"gpt-5.2-codex" = "gpt-5.3-codex"
"gpt-5.3-codex" = "gpt-5.4"
# Desktop app settings
[desktop]
followUpQueueMode = "queue"
appearanceTheme = "system"
usePointerCursors = false
composerEnterBehavior = "enter"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
git-branch-prefix = ""
git-show-sidebar-pr-icons = true
git-commit-instructions = """
Use conventional commits: 
```
<type>[optional scope]: <description>
```

Use only these types: fix|chore|test|feat|docs|style|refactor|

Be very concise"""
git-pr-instructions = """
Use the following struction:

TLDR:
<short one line overview of the PR>

Changes:
<concise, high level bullet points of the changes>

How to test:
<concise instructions on how to test>

Potential risks:
<tersely outline any things that might be broken as a result of these changes>"""
conversationDetailMode = "STEPS_PROSE"
show-context-window-usage = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
ambient-suggestions-enabled = false

