
# Runtime defaults

model = "gpt-6-astra"
model_reasoning_effort = "medium"   # minimal|low|medium|high|xhigh
model_reasoning_summary = "concise"
model_verbosity = "low"             # low|medium|high

# Execution
approval_policy = "on-request"      # untrusted|on-request|never
sandbox_mode = "workspace-write"    # read-only|workspace-write|danger-full-access

# Interface
file_opener = "vscode"             
web_search = "live"
personality = "pragmatic"

# Notifications
notify = ["/Users/henryblack/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
approvals_reviewer = "auto_review"

# Feature flags
[features]
shell_snapshot = true
undo = true
terminal_resize_reflow = true
goals = true
hooks = true
js_repl = false

# TUI
[tui]
notifications = true
session_picker_view = "comfortable"

# Project roots and trust
# `.codex-workspace` is placed in ~/Documents/Codex so all Codex workspaces
# beneath it resolve to that single trusted project root.
project_root_markers = [".git", ".codex-workspace"]

